title: Dynatrace AI Observability for Claude (Desktop app & CLI)
description: >
  Installer scripts (macOS, Linux, Windows) that bring Claude Code telemetry
  from the Claude Desktop app (Code tab) and the claude CLI into Dynatrace
  without VS Code: the same Python hook and OpenTelemetry Collector used by the
  dt-ai-observability-vscode asset, packaged as a user service with the API
  token in the OS credential store, plus optional Claude Code native OTel
  metrics and logs and a Claude-only "Developers AI Usage" dashboard. Includes a
  third layer, connector/: a Dynatrace Workflow (plus a Team-plan CSV importer)
  that imports Anthropic's official per-user daily usage and cost (Enterprise
  Analytics API, Console Admin API) as claude.usage.daily business events,
  covering claude.ai chat, Cowork, Design and Claude Code on the web, with a
  dashboard and a dtctl-based deploy script.
purpose: >
  When developers use Claude through the Desktop app or the terminal instead
  of VS Code, this integration gives per-developer token, cost, model and
  tool-call observability (user.email, squad, cost_center) with prompt content
  stripped by default, so platform and FinOps teams can see adoption and spend
  across the whole fleet with one dashboard.
