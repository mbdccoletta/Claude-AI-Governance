<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9cf9"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e6a"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9962b"/></marker>
  </defs>
  <style>
    .lane { fill:#1b1b22; stroke:#2b2b33; }
    .title { fill:#fff; font-size:26px; font-weight:700; }
    .sub { fill:#b3b7bd; font-size:14px; }
    .lanet { fill:#fff; font-size:16px; font-weight:700; letter-spacing:1px; }
    .box { fill:#24242c; stroke:#3a3a44; stroke-width:1; rx:12; }
    .bb { fill:#1e2633; stroke:#4f9cf9; stroke-width:1.6; rx:12; }
    .bg { fill:#1f2a24; stroke:#2e9e6a; stroke-width:1.6; rx:12; }
    .bo { fill:#2a2420; stroke:#d9962b; stroke-width:1.6; rx:12; }
    .bx { fill:#2a2022; stroke:#c0392b; stroke-width:1.4; rx:12; }
    .h { fill:#fff; font-size:15px; font-weight:700; }
    .t { fill:#d7dadf; font-size:13px; }
    .k { fill:#9aa0a6; font-size:12px; }
    .ln { stroke:#9aa0a6; stroke-width:2; fill:none; marker-end:url(#m); }
    .lb { stroke:#4f9cf9; stroke-width:2; fill:none; marker-end:url(#mb); }
    .lg { stroke:#2e9e6a; stroke-width:2; fill:none; marker-end:url(#mg); }
    .lo { stroke:#d9962b; stroke-width:2; fill:none; marker-end:url(#mo); }
  </style>
  <rect width="1400" height="900" fill="#16161d"/>
  <text x="30" y="44" class="title">Como os dados são coletados</text>
  <text x="30" y="68" class="sub">Azul = camada 1 (hooks) · verde = camada 2 (OTel nativo do Claude Code) · âmbar = camada 3 (APIs oficiais da Anthropic) · cinza = consumo</text>

  <!-- column headers -->
  <text x="48" y="104" class="lanet">ONDE O USO ACONTECE</text>
  <text x="398" y="104" class="lanet">COMO CAPTURAMOS</text>
  <text x="768" y="104" class="lanet">DYNATRACE (GRAIL)</text>
  <text x="1098" y="104" class="lanet">O QUE SE VÊ</text>

  <!-- column 1: sources -->
  <rect x="48" y="118" width="310" height="118" class="bb"/>
  <text x="62" y="142" class="h">Máquina do desenvolvedor</text>
  <text x="62" y="166" class="t">• Claude Desktop (Code tab), claude CLI,</text>
  <text x="62" y="184" class="t">  VS Code ou Cursor</text>
  <text x="62" y="204" class="t">• Hooks do Claude Code (eventos)</text>
  <text x="62" y="224" class="t">• OTel nativo quando habilitado</text>

  <rect x="48" y="250" width="310" height="96" class="bg"/>
  <text x="62" y="274" class="h">Claude Code na web (nuvem)</text>
  <text x="62" y="298" class="t">• Sem acesso ao collector local</text>
  <text x="62" y="318" class="t">• OTel nativo direto, se o ambiente</text>
  <text x="62" y="336" class="t">  cloud tiver as variáveis OTEL_*</text>

  <rect x="48" y="360" width="310" height="118" class="bo"/>
  <text x="62" y="384" class="h">claude.ai: chat, Cowork, Design</text>
  <text x="62" y="408" class="t">• Nenhum hook, nenhum OTel</text>
  <text x="62" y="428" class="t">• Enterprise: Analytics API por usuário</text>
  <text x="62" y="448" class="t">• Team: CSV de gastos (manual)</text>
  <text x="62" y="468" class="t">• Pro / Max pessoal: sem fonte</text>

  <rect x="48" y="492" width="310" height="96" class="bo"/>
  <text x="62" y="516" class="h">Org do Claude Console (API)</text>
  <text x="62" y="540" class="t">• Admin API: Claude Code por usuário</text>
  <text x="62" y="560" class="t">• Admin API: uso de API por workspace</text>
  <text x="62" y="580" class="t">• Sem claude.ai nesse tipo de org</text>

  <rect x="48" y="602" width="310" height="60" class="bx"/>
  <text x="62" y="626" class="h">Fora de alcance</text>
  <text x="62" y="648" class="t">• Claude via Bedrock, Vertex ou Foundry</text>

  <!-- column 2: capture -->
  <rect x="398" y="118" width="330" height="140" class="bb"/>
  <text x="412" y="142" class="h">Camada 1 · hook otel-hook.py</text>
  <text x="412" y="166" class="t">• 1 span "chat" por turno (prompt → resposta)</text>
  <text x="412" y="186" class="t">• 1 span por tool call, com input e output</text>
  <text x="412" y="206" class="t">• Tokens lidos do JSONL da sessão</text>
  <text x="412" y="226" class="t">• Prompt e resposta só com --capture-prompts</text>
  <text x="412" y="246" class="t">• Envia OTLP/JSON para 127.0.0.1:4318</text>

  <rect x="398" y="272" width="330" height="140" class="bg"/>
  <text x="412" y="296" class="h">Camada 2 · OTel nativo do Claude Code</text>
  <text x="412" y="320" class="t">• Métricas: tokens por tipo, custo, sessões,</text>
  <text x="412" y="338" class="t">  linhas de código, commits</text>
  <text x="412" y="358" class="t">• Logs: api_request (tokens + custo por</text>
  <text x="412" y="376" class="t">  chamada), user_prompt, tool_decision…</text>
  <text x="412" y="398" class="t">• Export a cada 10 s / 5 s → 127.0.0.1:4318</text>

  <rect x="398" y="426" width="330" height="140" class="box"/>
  <text x="412" y="450" class="h">Collector OTel local (serviço do usuário)</text>
  <text x="412" y="474" class="t">• Receptor OTLP só em loopback (4318)</text>
  <text x="412" y="494" class="t">• Remove prompts quando captura está off</text>
  <text x="412" y="514" class="t">• Adiciona e-mail, squad, cost center</text>
  <text x="412" y="534" class="t">• Exporta por HTTPS: traces, metrics, logs</text>
  <text x="412" y="554" class="k">  https://TENANT.live.dynatrace.com/api/v2/otlp</text>

  <rect x="398" y="580" width="330" height="160" class="bo"/>
  <text x="412" y="604" class="h">Camada 3 · Workflow no tenant</text>
  <text x="412" y="628" class="t">• Todo dia 15:00 UTC, 4 tasks JavaScript</text>
  <text x="412" y="648" class="t">• Chave lida do Credential vault pelo nome</text>
  <text x="412" y="668" class="t">• Enterprise: 10 dias (revisões de custo)</text>
  <text x="412" y="688" class="t">• Console: 3 dias (1d passado + horas de hoje)</text>
  <text x="412" y="708" class="t">• 60 req/min, backoff, cursor fixo</text>
  <text x="412" y="728" class="t">• Team: importador CSV (manual)</text>

  <!-- column 3: Dynatrace -->
  <rect x="768" y="118" width="300" height="96" class="box"/>
  <text x="782" y="142" class="h">OTLP ingest</text>
  <text x="782" y="166" class="t">• Token: openTelemetryTrace.ingest,</text>
  <text x="782" y="184" class="t">  metrics.ingest, logs.ingest</text>
  <text x="782" y="204" class="t">• OpenPipeline → buckets default_*</text>

  <rect x="768" y="228" width="300" height="76" class="bb"/>
  <text x="782" y="252" class="h">Spans gen_ai.*</text>
  <text x="782" y="276" class="t">• service.name claude-code-desktop</text>
  <text x="782" y="294" class="t">  ou claude-code</text>

  <rect x="768" y="318" width="300" height="96" class="bg"/>
  <text x="782" y="342" class="h">Métricas e logs nativos</text>
  <text x="782" y="366" class="t">• claude_code.token.usage, cost.usage</text>
  <text x="782" y="386" class="t">• Eventos: api_request, user_prompt,</text>
  <text x="782" y="404" class="t">  tool_decision (sem prefixo)</text>

  <rect x="768" y="428" width="300" height="138" class="box"/>
  <text x="782" y="452" class="h">Pré-requisitos no tenant</text>
  <text x="782" y="476" class="t">• App AI &amp; LLM Observability</text>
  <text x="782" y="496" class="t">• Token de ingest (3 escopos)</text>
  <text x="782" y="516" class="t">• Credential vault: Token, AppEngine</text>
  <text x="782" y="536" class="t">• Allowlist de saída: api.anthropic.com</text>
  <text x="782" y="556" class="t">• IAM: leitura dos buckets de logs</text>

  <rect x="768" y="580" width="300" height="160" class="bo"/>
  <text x="782" y="604" class="h">Bizevents claude.usage.daily</text>
  <text x="782" y="628" class="t">• 1 evento por usuário × produto ×</text>
  <text x="782" y="646" class="t">  modelo × dia × fonte</text>
  <text x="782" y="666" class="t">• user.email, product, model, tokens,</text>
  <text x="782" y="684" class="t">  requests, cost_usd, usage.date</text>
  <text x="782" y="704" class="t">• dedup.key: hash dos cinco campos</text>
  <text x="782" y="724" class="t">• Append-only → sempre usar dedup</text>

  <!-- column 4: consumption -->
  <rect x="1098" y="118" width="254" height="96" class="box"/>
  <text x="1112" y="142" class="h">App AI Observability</text>
  <text x="1112" y="166" class="t">• Prompts stream, conversas</text>
  <text x="1112" y="186" class="t">• Tool calls, latência por modelo</text>
  <text x="1112" y="206" class="k">  spans (camada 1)</text>

  <rect x="1098" y="228" width="254" height="96" class="box"/>
  <text x="1112" y="252" class="h">Dashboard Developers AI Usage</text>
  <text x="1112" y="276" class="t">• Custo, requests, sessões, devs</text>
  <text x="1112" y="296" class="t">• Cache hit, p50 / p95, por time</text>
  <text x="1112" y="316" class="k">  spans + métricas (camadas 1 e 2)</text>

  <rect x="1098" y="338" width="254" height="96" class="box"/>
  <text x="1112" y="362" class="h">Dashboard Claude usage (oficial)</text>
  <text x="1112" y="386" class="t">• Custo oficial por desenvolvedor</text>
  <text x="1112" y="406" class="t">• Por produto, top 10, frescor</text>
  <text x="1112" y="426" class="k">  bizevents (camada 3)</text>

  <rect x="1098" y="448" width="254" height="118" class="box"/>
  <text x="1112" y="472" class="h">Conciliação oficial × observado</text>
  <text x="1112" y="496" class="t">• Join bizevents ⟷ logs api_request</text>
  <text x="1112" y="516" class="t">• Por usuário e dia</text>
  <text x="1112" y="536" class="t">• Cobertura da instrumentação</text>
  <text x="1112" y="556" class="k">  camadas 2 + 3</text>

  <rect x="1098" y="580" width="254" height="160" class="box"/>
  <text x="1112" y="604" class="h">Dynatrace Evals (opcional)</text>
  <text x="1112" y="628" class="t">• PII, prompt injection, toxicidade…</text>
  <text x="1112" y="648" class="t">• Julga os spans com conteúdo</text>
  <text x="1112" y="668" class="t">• Resultados como bizevents</text>
  <text x="1112" y="688" class="t">• Chama um LLM juiz: custo e opt-in</text>
  <text x="1112" y="708" class="k">  exige --capture-prompts</text>

  <!-- arrows -->
  <path d="M358,177 L398,177" class="lb"/>
  <path d="M358,200 C378,200 378,340 398,340" class="lg"/>
  <path d="M358,298 C378,298 378,330 398,330" class="lg"/>
  <path d="M563,258 L563,272" class="lb"/>
  <path d="M563,412 L563,426" class="lg"/>
  <path d="M728,496 C748,496 748,166 768,166" class="ln"/>
  <path d="M918,214 L918,228" class="lb"/>
  <path d="M918,304 L918,318" class="lg"/>
  <path d="M358,420 C378,420 378,660 398,660" class="lo"/>
  <path d="M358,540 C378,540 378,670 398,670" class="lo"/>
  <path d="M728,660 L768,660" class="lo"/>
  <path d="M1068,266 L1098,166" class="lb"/>
  <path d="M1068,276 L1098,276" class="lb"/>
  <path d="M1068,366 L1098,296" class="lg"/>
  <path d="M1068,660 L1098,386" class="lo"/>
  <path d="M1068,680 L1098,496" class="lo"/>
  <path d="M1068,380 C1084,380 1084,516 1098,516" class="lg"/>

  <!-- legend -->
  <rect x="30" y="764" width="1340" height="112" class="lane" rx="14"/>
  <text x="48" y="790" class="lanet">O QUE CADA CAMADA RESPONDE</text>
  <text x="48" y="814" class="t"><tspan fill="#4f9cf9" font-weight="700">Camada 1</tspan>: o que aconteceu em cada conversa e tool call, em tempo real. Só nas máquinas instrumentadas.</text>
  <text x="48" y="836" class="t"><tspan fill="#2e9e6a" font-weight="700">Camada 2</tspan>: tokens e custo por chamada de API, sessões, linhas de código e commits, em segundos. Mesmas máquinas; web se configurado.</text>
  <text x="48" y="858" class="t"><tspan fill="#d9962b" font-weight="700">Camada 3</tspan>: quanto a Anthropic cobra por usuário e produto, diário, para toda a organização. Não cobre planos pessoais nem Bedrock.</text>
</svg>
