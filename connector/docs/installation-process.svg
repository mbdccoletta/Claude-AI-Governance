<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9cf9"/></marker>
  </defs>
  <style>
    .lane { fill:#1b1b22; stroke:#2b2b33; }
    .title { fill:#fff; font-size:26px; font-weight:700; }
    .sub { fill:#b3b7bd; font-size:14px; }
    .lanet { fill:#fff; font-size:16px; font-weight:700; letter-spacing:1px; }
    .box { fill:#24242c; stroke:#3a3a44; stroke-width:1; rx:12; }
    .bb { fill:#1e2633; stroke:#4f9cf9; stroke-width:1.6; rx:12; }
    .bo { fill:#2a2420; stroke:#d9962b; stroke-width:1.6; rx:12; }
    .bg { fill:#1f2a24; stroke:#2e9e6a; stroke-width:1.6; rx:12; }
    .h { fill:#fff; font-size:15px; font-weight:700; }
    .t { fill:#d7dadf; font-size:13px; }
    .k { fill:#9aa0a6; font-size:12px; }
    .n { fill:#fff; font-size:12px; font-weight:700; }
    .ln { stroke:#9aa0a6; stroke-width:2; fill:none; marker-end:url(#m); }
    .lb { stroke:#4f9cf9; stroke-width:2; fill:none; marker-end:url(#mb); stroke-dasharray:6 5; }
  </style>
  <rect width="1400" height="860" fill="#16161d"/>
  <text x="30" y="44" class="title">Processo de instalação</text>
  <text x="30" y="68" class="sub">Caixas âmbar = passo manual com um segredo (nunca no chat nem no repositório) · verde = validação · ordem: admin → desenvolvedor → admin</text>

  <!-- lane 0 -->
  <rect x="30" y="88" width="1340" height="150" class="lane" rx="14"/>
  <text x="48" y="114" class="lanet">0 · ANTES, NO TENANT (admin Dynatrace, uma vez)</text>
  <rect x="48" y="128" width="310" height="96" class="box"/>
  <circle cx="68" cy="150" r="10" fill="#9aa0a6"/><text x="64" y="154" class="n">a</text>
  <text x="86" y="154" class="h">App e acesso dtctl</text>
  <text x="62" y="178" class="t">• Hub: instalar AI &amp; LLM Observability</text>
  <text x="62" y="198" class="t">• dtctl auth login no tenant (OAuth)</text>
  <rect x="378" y="128" width="310" height="96" class="bo"/>
  <circle cx="398" cy="150" r="10" fill="#d9962b"/><text x="394" y="154" class="n">b</text>
  <text x="416" y="154" class="h">Token de ingest</text>
  <text x="392" y="178" class="t">• Access tokens, 3 escopos: traces,</text>
  <text x="392" y="196" class="t">  metrics e logs ingest</text>
  <text x="392" y="216" class="k">• o dev cola no instalador (oculto)</text>
  <rect x="708" y="128" width="310" height="96" class="bo"/>
  <circle cx="728" cy="150" r="10" fill="#d9962b"/><text x="724" y="154" class="n">c</text>
  <text x="746" y="154" class="h">Chave Anthropic no vault</text>
  <text x="722" y="178" class="t">• Credential vault: Token, escopo AppEngine,</text>
  <text x="722" y="196" class="t">  acesso sem contexto de app, owner only</text>
  <text x="722" y="216" class="k">• só para a camada 3 (fonte oficial)</text>
  <rect x="1038" y="128" width="314" height="96" class="box"/>
  <circle cx="1058" cy="150" r="10" fill="#9aa0a6"/><text x="1054" y="154" class="n">d</text>
  <text x="1076" y="154" class="h">Quem gera a chave Anthropic</text>
  <text x="1052" y="178" class="t">• Enterprise: primary owner → Analytics key</text>
  <text x="1052" y="198" class="t">• Console: admin → Admin key · Team: CSV</text>

  <!-- lane dev -->
  <rect x="30" y="254" width="660" height="430" class="lane" rx="14"/>
  <text x="48" y="280" class="lanet">MÁQUINA DO DEV · camadas 1 + 2</text>
  <text x="48" y="300" class="k">./install.sh --endpoint TENANT --email EMAIL   |   .\install.ps1 -Endpoint TENANT -Email EMAIL</text>

  <rect x="48" y="314" width="300" height="76" class="bb"/>
  <circle cx="68" cy="336" r="10" fill="#4f9cf9"/><text x="64" y="340" class="n">1</text>
  <text x="86" y="340" class="h">Hook do Claude Code</text>
  <text x="62" y="364" class="t">• ~/.claude/otel-hook.py + 4 entradas</text>
  <text x="62" y="382" class="t">  em settings.json</text>

  <rect x="372" y="314" width="300" height="76" class="bb"/>
  <circle cx="392" cy="336" r="10" fill="#4f9cf9"/><text x="388" y="340" class="n">2</text>
  <text x="410" y="340" class="h">Atributos do dev</text>
  <text x="386" y="364" class="t">• e-mail, squad, cost center</text>
  <text x="386" y="382" class="t">• flag de captura de prompts</text>

  <rect x="48" y="404" width="300" height="76" class="bb"/>
  <circle cx="68" cy="426" r="10" fill="#4f9cf9"/><text x="64" y="430" class="n">3</text>
  <text x="86" y="430" class="h">Collector OTel</text>
  <text x="62" y="454" class="t">• otelcol-contrib (~100 MB, uma vez)</text>
  <text x="62" y="472" class="t">• config com redação e atributos</text>

  <rect x="372" y="404" width="300" height="76" class="bo"/>
  <circle cx="392" cy="426" r="10" fill="#d9962b"/><text x="388" y="430" class="n">4</text>
  <text x="410" y="430" class="h">Token no cofre do SO</text>
  <text x="386" y="454" class="t">• Keychain / secret-tool / arquivo 0600</text>
  <text x="386" y="472" class="t">• colado uma vez, prompt oculto</text>

  <rect x="48" y="494" width="300" height="76" class="bb"/>
  <circle cx="68" cy="516" r="10" fill="#4f9cf9"/><text x="64" y="520" class="n">5</text>
  <text x="86" y="520" class="h">Serviço de usuário</text>
  <text x="62" y="544" class="t">• launchd / systemd / Scheduled Task</text>
  <text x="62" y="562" class="t">• 127.0.0.1:4318 · health 13133</text>

  <rect x="372" y="494" width="300" height="76" class="bb"/>
  <circle cx="392" cy="516" r="10" fill="#4f9cf9"/><text x="388" y="520" class="n">6</text>
  <text x="410" y="520" class="h">OTel nativo (opcional)</text>
  <text x="386" y="544" class="t">• --enable-native-otel: env em settings.json</text>
  <text x="386" y="562" class="t">• vale só para sessões novas</text>

  <rect x="48" y="584" width="624" height="84" class="bg"/>
  <circle cx="68" cy="606" r="10" fill="#2e9e6a"/><text x="64" y="610" class="n">7</text>
  <text x="86" y="610" class="h">Validação</text>
  <text x="62" y="634" class="t">• health local 200 · collector.log sem "Exporting failed" (401 = token errado)</text>
  <text x="62" y="654" class="t">• fetch spans | filter service.name == "claude-code-desktop" · reiniciar sessões abertas</text>

  <!-- lane tenant -->
  <rect x="710" y="254" width="660" height="430" class="lane" rx="14"/>
  <text x="728" y="280" class="lanet">TENANT · camada 3 (admin, uma vez)</text>
  <text x="728" y="300" class="k">connector/deploy/deploy.sh --org-type enterprise|console|team --yes</text>

  <rect x="728" y="314" width="300" height="76" class="bo"/>
  <circle cx="748" cy="336" r="10" fill="#d9962b"/><text x="744" y="340" class="n">1</text>
  <text x="766" y="340" class="h">Allowlist de saída</text>
  <text x="742" y="364" class="t">• api.anthropic.com adicionado por merge</text>
  <text x="742" y="382" class="t">• hosts existentes preservados</text>

  <rect x="1052" y="314" width="300" height="76" class="bo"/>
  <circle cx="1072" cy="336" r="10" fill="#d9962b"/><text x="1068" y="340" class="n">2</text>
  <text x="1090" y="340" class="h">Credencial (ver 0c)</text>
  <text x="1066" y="364" class="t">• criada na UI com OAuth do dtctl</text>
  <text x="1066" y="382" class="t">• o workflow acha pelo nome</text>

  <rect x="728" y="404" width="300" height="76" class="bo"/>
  <circle cx="748" cy="426" r="10" fill="#d9962b"/><text x="744" y="430" class="n">3</text>
  <text x="766" y="430" class="h">Workflow (dtctl apply)</text>
  <text x="742" y="454" class="t">• agendado 15:00 UTC, inputs preenchidos</text>
  <text x="742" y="472" class="t">• id gravado para reaplicar</text>

  <rect x="1052" y="404" width="300" height="76" class="box"/>
  <circle cx="1072" cy="426" r="10" fill="#9aa0a6"/><text x="1068" y="430" class="n">4</text>
  <text x="1090" y="430" class="h">Dashboards</text>
  <text x="1066" y="454" class="t">• dtctl apply -f ou Dashboards → Upload</text>
  <text x="1066" y="472" class="t">• camada 3 e Developers AI Usage</text>

  <rect x="728" y="494" width="624" height="76" class="bg"/>
  <circle cx="748" cy="516" r="10" fill="#2e9e6a"/><text x="744" y="520" class="n">5</text>
  <text x="766" y="520" class="h">Primeira execução e validação</text>
  <text x="742" y="544" class="t">• dtctl exec workflow ID --wait --show-results → chamadas, páginas, eventos</text>
  <text x="742" y="562" class="t">• fetch bizevents | filter event.type == "claude.usage.daily" | dedup dedup.key</text>

  <rect x="728" y="584" width="624" height="84" class="box"/>
  <text x="742" y="608" class="h">Depois, sozinho</text>
  <text x="742" y="632" class="t">• Execução diária: resolve_config → enterprise | console | team (por org_type)</text>
  <text x="742" y="652" class="t">• Team: exportar o CSV e rodar csv-import/import_team_spend.py quando quiser</text>

  <!-- arrows -->
  <path d="M348,352 L372,352" class="ln"/>
  <path d="M198,390 L198,404" class="ln"/>
  <path d="M348,442 L372,442" class="ln"/>
  <path d="M198,480 L198,494" class="ln"/>
  <path d="M522,480 L522,494" class="ln"/>
  <path d="M198,570 L198,584" class="ln"/>
  <path d="M522,570 L522,584" class="ln"/>
  <path d="M878,390 L878,404" class="ln"/>
  <path d="M1028,442 L1052,442" class="ln"/>
  <path d="M878,480 L878,494" class="ln"/>
  <path d="M1202,480 L1202,494" class="ln"/>
  <path d="M533,224 L533,314" class="lb"/>
  <path d="M863,224 L863,314" class="lb"/>
  <path d="M1195,224 L1195,314" class="lb"/>

  <!-- footer -->
  <rect x="30" y="700" width="1340" height="136" class="lane" rx="14"/>
  <text x="48" y="726" class="lanet">PAPÉIS E PRÉ-REQUISITOS</text>
  <text x="48" y="750" class="t">• Dev: roda o instalador na própria máquina (minutos, sem Docker, sem admin). Precisa de Python 3, curl/tar e saída HTTPS para github.com e TENANT.live.dynatrace.com.</text>
  <text x="48" y="772" class="t">• Admin Dynatrace: app, token de ingest, vault, allowlist, IAM dos buckets de logs, deploy.sh. Admin Claude: gera a Admin key (Console) ou a Analytics key (Enterprise).</text>
  <text x="48" y="794" class="t">• Claude Code pode executar o deploy inteiro via dtctl (skill deploy-claude-usage-connector); só não cola segredos, que ficam com o admin.</text>
  <text x="48" y="816" class="t">• Desinstalar: ./uninstall.sh remove hook, env, serviço e Keychain. Coexiste com a extensão VS Code (mesmo hook).</text>
</svg>
