<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9cf9"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e6a"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/></marker>
  </defs>
  <style>
    .lane { fill:#1b1b22; stroke:#2b2b33; }
    .title { fill:#fff; font-size:20px; font-weight:700; }
    .sub { fill:#b3b7bd; font-size:12px; }
    .lanet { fill:#fff; font-size:13px; font-weight:700; }
    .box { fill:#24242c; stroke:#3a3a44; stroke-width:1; rx:8; }
    .b1 { fill:#1e2633; stroke:#4f9cf9; stroke-width:1.2; rx:8; }
    .b2 { fill:#1f2a24; stroke:#2e9e6a; stroke-width:1.2; rx:8; }
    .b3 { fill:#2a2420; stroke:#b7791f; stroke-width:1.2; rx:8; }
    .bx { fill:#2a2022; stroke:#c0392b; stroke-width:1.2; rx:8; }
    .h { fill:#fff; font-size:12.5px; font-weight:700; }
    .t { fill:#cfd3d8; font-size:11px; }
    .tag { font-size:10.5px; font-weight:700; }
    .l1 { stroke:#4f9cf9; stroke-width:1.6; fill:none; marker-end:url(#a1); }
    .l2 { stroke:#2e9e6a; stroke-width:1.6; fill:none; marker-end:url(#a2); }
    .l3 { stroke:#b7791f; stroke-width:1.6; fill:none; marker-end:url(#a3); }
    .l4 { stroke:#9aa0a6; stroke-width:1.4; fill:none; marker-end:url(#a4); }
    .leg { fill:#b3b7bd; font-size:11px; }
  </style>
  <rect width="1240" height="820" fill="#16161d"/>
  <text x="24" y="34" class="title">dt-ai-observability-claude: como os dados são coletados</text>
  <text x="24" y="54" class="sub">Três camadas, três fontes, um destino (Grail). Azul = camada 1 (hooks) · verde = camada 2 (OTel nativo do Claude Code) · âmbar = camada 3 (APIs oficiais da Anthropic). Cinza = consumo.</text>

  <!-- Column headers -->
  <text x="40" y="86" class="lanet">ONDE O USO ACONTECE</text>
  <text x="360" y="86" class="lanet">COMO CAPTURAMOS</text>
  <text x="700" y="86" class="lanet">DYNATRACE (tenant)</text>
  <text x="1010" y="86" class="lanet">O QUE SE VÊ</text>

  <!-- Sources -->
  <rect x="24" y="96" width="290" height="92" class="box"/>
  <text x="36" y="116" class="h">Máquina do desenvolvedor</text>
  <text x="36" y="134" class="t">Claude Desktop (Code tab) · claude CLI · VS Code / Cursor</text>
  <text x="36" y="150" class="t">O Claude Code expõe hooks (eventos) e, com</text>
  <text x="36" y="164" class="t">CLAUDE_CODE_ENABLE_TELEMETRY=1, exporta OTel nativo</text>
  <text x="36" y="180" class="t" fill="#4f9cf9">camada 1 + camada 2</text>

  <rect x="24" y="200" width="290" height="70" class="box"/>
  <text x="36" y="220" class="h">Claude Code na web (nuvem Anthropic)</text>
  <text x="36" y="238" class="t">Sem acesso ao collector local; OTel nativo só se o</text>
  <text x="36" y="252" class="t">ambiente cloud tiver as variáveis OTEL_* (protobuf direto)</text>
  <text x="36" y="266" class="t" fill="#2e9e6a">camada 2 (opcional) · camada 3</text>

  <rect x="24" y="282" width="290" height="92" class="box"/>
  <text x="36" y="302" class="h">claude.ai: chat, Cowork, Design, Claude Code web</text>
  <text x="36" y="320" class="t">Nenhum hook, nenhum OTel. Só a fonte oficial:</text>
  <text x="36" y="334" class="t">Enterprise → Analytics API (por usuário, por produto)</text>
  <text x="36" y="348" class="t">Team → CSV de gastos (manual) · Pro/Max pessoal → nada</text>
  <text x="36" y="366" class="t" fill="#b7791f">camada 3</text>

  <rect x="24" y="386" width="290" height="70" class="box"/>
  <text x="36" y="406" class="h">Org do Claude Console (API / Platform)</text>
  <text x="36" y="424" class="t">Admin API: usage_report/claude_code (por usuário)</text>
  <text x="36" y="438" class="t">e usage_report/messages (API por workspace)</text>
  <text x="36" y="452" class="t" fill="#b7791f">camada 3</text>

  <rect x="24" y="468" width="290" height="44" class="bx"/>
  <text x="36" y="488" class="h">Fora de alcance</text>
  <text x="36" y="504" class="t">Claude via Amazon Bedrock / Vertex / Foundry (usar billing da nuvem)</text>

  <!-- Capture -->
  <rect x="344" y="96" width="320" height="100" class="b1"/>
  <text x="356" y="116" class="h">Camada 1 · hook ~/.claude/otel-hook.py (Python)</text>
  <text x="356" y="134" class="t">UserPromptSubmit → Stop: 1 span "chat &lt;modelo&gt;" por turno</text>
  <text x="356" y="148" class="t">PreToolUse → PostToolUse: 1 span por tool call (input/output)</text>
  <text x="356" y="162" class="t">tokens lidos do JSONL da sessão (input+cache, output), custo se informado</text>
  <text x="356" y="176" class="t">prompt/resposta só com --capture-prompts · atributos: e-mail, squad, cost_center</text>
  <text x="356" y="190" class="t">envia OTLP/JSON para 127.0.0.1:4318</text>

  <rect x="344" y="208" width="320" height="86" class="b2"/>
  <text x="356" y="228" class="h">Camada 2 · OTel nativo do Claude Code</text>
  <text x="356" y="246" class="t">métricas: claude_code.token.usage (input/output/cacheRead/cacheCreation),</text>
  <text x="356" y="260" class="t">claude_code.cost.usage, session.count, lines_of_code, commits</text>
  <text x="356" y="274" class="t">logs: api_request (tokens + cost_usd por chamada), user_prompt,</text>
  <text x="356" y="288" class="t">tool_decision, tool_result · delta a cada 10 s / 5 s → 127.0.0.1:4318</text>

  <rect x="344" y="306" width="320" height="86" class="box"/>
  <text x="356" y="326" class="h">Collector OTel local (otelcol-contrib, serviço de usuário)</text>
  <text x="356" y="344" class="t">receptor OTLP 4318 · processadores: redação de prompts (se off),</text>
  <text x="356" y="358" class="t">resource (user.email, squad, cost_center, deployment.environment),</text>
  <text x="356" y="372" class="t">normalização do e-mail nativo → claude.account_email, batch</text>
  <text x="356" y="386" class="t">exporter otlp_http → https://&lt;tenant&gt;.live.dynatrace.com/api/v2/otlp</text>

  <rect x="344" y="404" width="320" height="108" class="b3"/>
  <text x="356" y="424" class="h">Camada 3 · Workflow "Claude usage connector" (no tenant)</text>
  <text x="356" y="442" class="t">agendado 15:00 UTC · 4 tasks Run JavaScript · org_type gate</text>
  <text x="356" y="456" class="t">chave da Anthropic lida do Credential vault pelo nome</text>
  <text x="356" y="470" class="t">fetch api.anthropic.com (allowlist) · 60 req/min, backoff, cursor fixo</text>
  <text x="356" y="484" class="t">Enterprise 10 dias (revisões) · Console 3 dias (1d + horas de hoje)</text>
  <text x="356" y="498" class="t">Team: csv-import/import_team_spend.py (manual) · tudo vira bizevents</text>

  <!-- Dynatrace -->
  <rect x="694" y="96" width="290" height="60" class="box"/>
  <text x="706" y="116" class="h">OTLP ingest · /api/v2/otlp/v1/{traces,metrics,logs}</text>
  <text x="706" y="134" class="t">token: openTelemetryTrace.ingest + metrics.ingest + logs.ingest</text>
  <text x="706" y="148" class="t">OpenPipeline → buckets default_* (ver permissões IAM)</text>

  <rect x="694" y="168" width="290" height="52" class="b1"/>
  <text x="706" y="188" class="h">Grail · spans (gen_ai.*)</text>
  <text x="706" y="206" class="t">service.name claude-code-desktop | claude-code · AI Obs app</text>

  <rect x="694" y="232" width="290" height="52" class="b2"/>
  <text x="706" y="252" class="h">Grail · métricas claude_code.* e logs de eventos</text>
  <text x="706" y="270" class="t">event.name api_request, user_prompt, tool_* (sem prefixo)</text>

  <rect x="694" y="296" width="290" height="96" class="box"/>
  <text x="706" y="316" class="h">Pré-requisitos no tenant</text>
  <text x="706" y="334" class="t">app AI &amp; LLM Observability (Hub) · token de ingest</text>
  <text x="706" y="348" class="t">Credential vault: Token, escopo AppEngine, acesso sem app context</text>
  <text x="706" y="362" class="t">allowlist de saída do JS runtime: api.anthropic.com</text>
  <text x="706" y="376" class="t">IAM: leitura dos buckets (cuidado com DENY em grupos de teste)</text>
  <text x="706" y="390" class="t">dtctl com contexto OAuth para o deploy automatizado</text>

  <rect x="694" y="404" width="290" height="108" class="b3"/>
  <text x="706" y="424" class="h">Grail · bizevents claude.usage.daily</text>
  <text x="706" y="442" class="t">1 evento por usuário × produto × modelo × dia × fonte</text>
  <text x="706" y="456" class="t">user.email, product, model, tokens.*, requests, cost_usd,</text>
  <text x="706" y="470" class="t">source (enterprise_api | console_api | team_csv), usage.date,</text>
  <text x="706" y="484" class="t">dedup.key = sha256(email|product|model|date|source)</text>
  <text x="706" y="498" class="t">append-only → sempre: dedup dedup.key, sort: {timestamp desc}</text>

  <!-- Consumption -->
  <rect x="1004" y="96" width="212" height="80" class="box"/>
  <text x="1016" y="116" class="h">AI &amp; LLM Observability</text>
  <text x="1016" y="134" class="t">Prompts stream, conversas,</text>
  <text x="1016" y="148" class="t">tool calls, latência por modelo</text>
  <text x="1016" y="164" class="t" fill="#4f9cf9">spans (camada 1)</text>

  <rect x="1004" y="188" width="212" height="96" class="box"/>
  <text x="1016" y="208" class="h">Dashboard Developers AI Usage</text>
  <text x="1016" y="226" class="t">custo estimado, requests, sessões,</text>
  <text x="1016" y="240" class="t">devs, modelos, cache hit, p50/p95,</text>
  <text x="1016" y="254" class="t">por time / squad / cost center</text>
  <text x="1016" y="272" class="t" fill="#2e9e6a">spans + métricas (camadas 1 e 2)</text>

  <rect x="1004" y="296" width="212" height="96" class="box"/>
  <text x="1016" y="316" class="h">Dashboard Claude usage (camada 3)</text>
  <text x="1016" y="334" class="t">custo oficial por desenvolvedor,</text>
  <text x="1016" y="348" class="t">por produto (chat, Claude Code,</text>
  <text x="1016" y="362" class="t">Cowork, Design), top 10, frescor</text>
  <text x="1016" y="380" class="t" fill="#b7791f">bizevents (camada 3)</text>

  <rect x="1004" y="404" width="212" height="108" class="box"/>
  <text x="1016" y="424" class="h">Conciliação oficial × observado</text>
  <text x="1016" y="442" class="t">dql/official-vs-observed-tokens.dql</text>
  <text x="1016" y="456" class="t">join bizevents ⟷ logs api_request</text>
  <text x="1016" y="470" class="t">por user.email e dia → cobertura %</text>
  <text x="1016" y="484" class="t">da instrumentação e delta de custo</text>
  <text x="1016" y="502" class="t" fill="#9aa0a6">camadas 2 + 3</text>

  <!-- arrows: sources -> capture -->
  <path d="M314,130 L344,130" class="l1"/>
  <path d="M314,160 C330,160 330,250 344,250" class="l2"/>
  <path d="M314,235 C330,235 330,260 344,260" class="l2"/>
  <path d="M314,330 C330,330 330,440 344,440" class="l3"/>
  <path d="M314,420 L344,456" class="l3"/>
  <!-- capture -> collector -> dynatrace -->
  <path d="M504,196 L504,208" class="l1"/>
  <path d="M504,294 L504,306" class="l2"/>
  <path d="M664,350 C680,350 680,126 694,126" class="l4"/>
  <path d="M839,156 L839,168" class="l1"/>
  <path d="M839,220 L839,232" class="l2"/>
  <path d="M664,458 L694,458" class="l3"/>
  <!-- dynatrace -> consumption -->
  <path d="M984,194 L1004,136" class="l1"/>
  <path d="M984,258 L1004,236" class="l2"/>
  <path d="M984,458 L1004,344" class="l3"/>
  <path d="M984,470 L1004,458" class="l3"/>
  <path d="M984,270 C996,270 996,470 1004,470" class="l2"/>

  <!-- Install process strip -->
  <rect x="24" y="532" width="1192" height="150" class="lane" rx="10"/>
  <text x="40" y="554" class="lanet">PROCESSO DE INSTALAÇÃO (detalhe em docs/installation-process.svg)</text>
  <rect x="40" y="566" width="370" height="104" class="b1"/>
  <text x="52" y="586" class="h">Por desenvolvedor · ./install.sh (macOS/Linux) · install.ps1 (Windows)</text>
  <text x="52" y="604" class="t">1 hook + settings.json · 2 atributos (e-mail, squad, cost_center) · 3 collector</text>
  <text x="52" y="618" class="t">(~100 MB) · 4 token no Keychain · 5 serviço de usuário · 6 OTel nativo (--enable-native-otel)</text>
  <text x="52" y="632" class="t">7 validação: health 13133, log sem 401, fetch spans. Reiniciar sessões abertas.</text>
  <text x="52" y="650" class="t">Pré-requisitos: Python 3, curl/tar, token de ingest, saída HTTPS para github.com e &lt;tenant&gt;.live</text>
  <text x="52" y="664" class="t">Desinstalar: ./uninstall.sh · coexiste com a extensão VS Code (mesmo hook)</text>
  <rect x="426" y="566" width="390" height="104" class="b3"/>
  <text x="438" y="586" class="h">Por tenant · connector/deploy/deploy.sh --org-type &lt;tipo&gt; --yes (ou deploy_all.sh)</text>
  <text x="438" y="604" class="t">1 allowlist api.anthropic.com (merge) · 2 credencial (vault; manual com OAuth) ·</text>
  <text x="438" y="618" class="t">3 workflow via dtctl apply (id gravado) · 4 dashboards · 5 run-now + DQL de verificação</text>
  <text x="438" y="632" class="t">Pré-requisitos: dtctl com login OAuth no tenant; chave Anthropic (Enterprise: primary</text>
  <text x="438" y="646" class="t">owner → Analytics key; Console: admin → Admin key; Team: CSV); vault com escopo AppEngine</text>
  <text x="438" y="664" class="t">Claude Code executa tudo via skill deploy-claude-usage-connector, exceto colar segredos</text>
  <rect x="832" y="566" width="372" height="104" class="box"/>
  <text x="844" y="586" class="h">Papéis</text>
  <text x="844" y="604" class="t">Dev: roda o instalador na própria máquina (minutos, sem Docker, sem admin)</text>
  <text x="844" y="618" class="t">Admin Dynatrace: token de ingest, vault, allowlist, IAM dos buckets, deploy.sh</text>
  <text x="844" y="632" class="t">Admin Claude: gera a Admin key (Console) ou Analytics key (Enterprise, primary owner)</text>
  <text x="844" y="650" class="t">Segredos nunca passam pelo chat nem pelo repositório: prompt oculto, Keychain, vault</text>
  <text x="844" y="664" class="t">Conteúdo de prompts: off por padrão nas camadas 1 e 2; nunca existe na camada 3</text>

  <!-- Legend -->
  <rect x="24" y="698" width="1192" height="100" class="lane" rx="10"/>
  <text x="40" y="720" class="lanet">O QUE CADA CAMADA RESPONDE</text>
  <text x="40" y="740" class="leg"><tspan fill="#4f9cf9" font-weight="700">Camada 1 (hooks)</tspan>: o que aconteceu em cada conversa e tool call, em tempo real, com prompt opcional. Só nas máquinas instrumentadas; Desktop e CLI.</text>
  <text x="40" y="758" class="leg"><tspan fill="#2e9e6a" font-weight="700">Camada 2 (OTel nativo)</tspan>: tokens e custo por chamada de API, sessões, linhas de código e commits, em segundos. Mesmas máquinas; também sessões web se o ambiente tiver as variáveis.</text>
  <text x="40" y="776" class="leg"><tspan fill="#b7791f" font-weight="700">Camada 3 (oficial)</tspan>: quanto a Anthropic cobra por usuário e produto, diário, para toda a organização, inclusive claude.ai chat, Cowork, Design e Claude Code web. Não cobre planos pessoais nem Bedrock.</text>
  <text x="40" y="792" class="leg">Verificado em tenant de laboratório em 2026-10-19: spans e métricas de uma máquina real, logs nativos (após remover um DENY de IAM), 1 evento real do Console, demo team_csv, três workflows e dois dashboards.</text>
</svg>
